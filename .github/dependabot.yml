version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
      react-router:
        patterns: [react-router, react-router-dom]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
